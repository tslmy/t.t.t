name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets codecov-action authenticate with GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']  # PHPUnit 13 needs PHP >= 8.4.1
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.4' && 'xdebug' || 'none' }}
      - run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit ${{ matrix.php == '8.4' && '--coverage-clover coverage.xml' || '' }}
        env:
          XDEBUG_MODE: coverage
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
      - name: Upload coverage
        if: matrix.php == '8.4'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ttt .
