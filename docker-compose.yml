version: '3.1'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: ttt
    ports:
      - 80:80
    environment:
      - TTT_SITE_NAME
      - TTT_SITE_DESC
      - TTT_ITEMS_PER_PAGE
      - TTT_PREVIEW_BYTES
      - TTT_GISCUS_REPO
      - TTT_GISCUS_REPO_ID
      - TTT_GISCUS_CATEGORY
      - TTT_GISCUS_CATEGORY_ID
      - TTT_ANALYTICS_DOMAIN
      - TTT_ANALYTICS_SCRIPT_URL
    volumes:
      - "${PATH_TO_NOTES}:/var/www/html/public/content"
